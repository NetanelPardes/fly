<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tickets</title>
  <link rel="stylesheet" href="styles.css?v=20261013-route-tickets">
</head>
<body>
  <main class="page-shell">
    <header class="portal-header">
      <a class="home-link logo-link" href="index.html"><img src="assets/kodfly-logo.png" alt="KodFly"></a>
      <nav class="page-nav">
        <a href="customer-flights.html">Flights</a>
        <a class="active" href="customer-tickets.html">My tickets</a>
      </nav>
      <div class="top-actions">
        <button id="refreshButton" class="ghost-button">Refresh</button>
        <button id="logoutButton" class="danger-button">Logout</button>
      </div>
    </header>
    <section class="customer-hero">
      <div><p class="eyebrow">Customer portal</p><h1>My tickets</h1><p class="lead">Upgrade your class, add baggage, or download your ticket.</p></div>
      <button id="profileButton" class="identity-card light profile-button" type="button"><span id="roleBadge">Passenger</span><strong id="userName">Passenger</strong><small id="userEmail">-</small></button>
    </section>
    <section class="metrics">
      <article><small>Tickets</small><strong id="metricTickets">0</strong><span id="metricActiveTickets">0 active</span></article>
      <article><small>Baggage</small><strong id="metricBaggage">0</strong><span>registered bags</span></article>
      <article><small>Files</small><strong id="metricFiles">0</strong><span>ready to download</span></article>
      <article><small>Status</small><strong>Live</strong><span>connected to API</span></article>
    </section>
    <section class="panel"><div class="panel-head"><div><p class="eyebrow">Trips</p><h2>Tickets and upgrades</h2></div></div><div id="ticketsList" class="ticket-list"></div></section>
    <dialog id="ticketDialog">
      <form id="ticketOptionsForm" method="dialog" class="dialog-form">
        <h2>Manage ticket</h2><input id="manageTicketId" type="hidden">
        <label>Seat<input id="manageSeat" required readonly></label>
        <label>Class<select id="manageClass"><option>Economy</option><option>Business</option><option>First</option></select></label>
        <label>Baggage<select id="manageBaggage"><option value="0">No baggage</option><option value="10">10 kg</option><option value="20">20 kg</option><option value="25">25 kg</option><option value="35">35 kg</option></select></label>
        <div class="dialog-actions"><button type="button" id="closeTicketDialog" class="ghost-button">Close</button><button class="primary-button">Save changes</button></div>
      </form>
    </dialog>
    <dialog id="profileDialog">
      <form id="profileForm" method="dialog" class="dialog-form">
        <h2>My details</h2>
        <div class="compact-grid">
          <label>National ID<input id="profileNationalId" maxlength="9" required></label>
          <label>First name<input id="profileFirstName" maxlength="80" required></label>
          <label>Last name<input id="profileLastName" maxlength="80" required></label>
          <label>Full name<input id="profileFullName" maxlength="120" required></label>
          <label>Email<input id="profileEmail" type="email" maxlength="254" required></label>
          <label>Phone<input id="profilePhone" maxlength="30" required></label>
          <label>Gender<input id="profileGender" maxlength="20" required></label>
          <label>Address<input id="profileAddress" maxlength="240" required></label>
        </div>
        <div class="dialog-actions"><button type="button" id="closeProfile" class="ghost-button">Close</button><button class="primary-button">Save details</button></div>
      </form>
    </dialog>
    <div id="toast" class="toast" hidden></div>
  </main>
  <script src="shared.js?v=20261013-ticket-loader"></script>
  <script src="customer-tickets.js?v=20261013-ticket-loader"></script>
</body>
</html>
