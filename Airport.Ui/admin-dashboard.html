<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manager Dashboard</title><link rel="stylesheet" href="styles.css?v=20261013-manager-actions"></head>
<body>
  <main class="page-shell manager-layout">
    <aside class="sidebar manager-sidebar"><div class="brand"><span class="brand-mark">AM</span><div><strong>Manager Console</strong><small>Airport control</small></div></div><nav class="nav" id="adminNav"></nav><div class="identity-card"><span id="roleBadge">Admin</span><strong id="userName">Manager</strong><small id="userEmail">-</small></div></aside>
    <section class="workspace"><header class="topbar"><div><p class="eyebrow">Operations</p><h1>Dashboard</h1></div><div class="top-actions"><button id="refreshButton" class="ghost-button">Refresh</button><button id="logoutButton" class="danger-button">Logout</button></div></header><section class="metrics"><article><small>Flights</small><strong id="metricFlights">0</strong><span>schedule records</span></article><article><small>Tickets</small><strong id="metricTickets">0</strong><span id="metricActiveTickets">0 active</span></article><article><small>Users</small><strong id="metricUsers">0</strong><span>passengers and managers</span></article><article><small>Status</small><strong>Live</strong><span>connected to API</span></article></section><div class="panel"><div class="panel-head"><div><p class="eyebrow">Board</p><h2>Departures in the next hour</h2></div><span id="clock"></span></div><div id="departureBoard" class="departure-board"></div></div></section>
    <div id="toast" class="toast" hidden></div>
  </main>
  <script src="shared.js?v=20261013-manager-actions"></script><script src="admin-common.js?v=20261013-manager-actions"></script><script src="admin-dashboard.js"></script>
</body>
</html>
