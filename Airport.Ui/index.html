<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airport Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="portal">
    <section class="entry-screen">
      <div class="entry-copy">
        <p class="eyebrow">Airport Management System</p>
        <h1>Choose your terminal</h1>
        <p class="lead">Two separate portals: one for passengers, one for airport management.</p>
      </div>
      <div class="entry-cards">
        <a class="entry-card passenger-card" href="customer-login.html">
          <span>Customer</span>
          <strong>Book, upgrade, fly</strong>
          <small>Flights, seats, baggage, upgrades, cancellations.</small>
        </a>
        <a class="entry-card admin-card" href="admin-login.html">
          <span>Manager</span>
          <strong>Control the airport</strong>
          <small>Flights, gates, users, tickets, baggage, and live operations.</small>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
